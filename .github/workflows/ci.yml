name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Clippy
        run: cargo clippy --all-targets
        working-directory: backend
      - name: Tests
        run: cargo test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: |
          npm install
          npm run build
        working-directory: frontend


  ssh-debug:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostic secret SSH (structure uniquement)
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
          SUSER: ${{ secrets.SSH_USER }}
        run: |
          echo "ssh: $(ssh -V 2>&1 || true)"
          echo "len(KEY)=${#KEY} len(HOST)=${#HOST} len(SUSER)=${#SUSER}"
          echo "lignes KEY=$(printf '%s' "$KEY" | wc -l)"
          case "$KEY" in
            *"BEGIN OPENSSH PRIVATE KEY"*) echo "header=OPENSSH";;
            *"BEGIN RSA PRIVATE KEY"*) echo "header=RSA_PEM";;
            *"BEGIN PRIVATE KEY"*) echo "header=PKCS8_PEM";;
            *"BEGIN EC PRIVATE KEY"*) echo "header=EC_PEM";;
            "") echo "header=EMPTY";;
            *) echo "header=UNKNOWN";;
          esac
          if printf '%s' "$KEY" | grep -q "$(printf '\r')"; then echo "CRLF=present"; else echo "CRLF=absent"; fi
          printf '%s\n' "$KEY" > /tmp/k; chmod 600 /tmp/k
          if ssh-keygen -y -f /tmp/k > /tmp/pub 2>/tmp/err; then
            echo "ssh-keygen -y: OK, prefix pubkey: $(head -c 40 /tmp/pub)"
          else
            echo "ssh-keygen -y: ECHEC"; cat /tmp/err
          fi

  deploy:
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchroniser le code vers la VM
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          SOURCE: ./
          TARGET: /opt/team-kanban/
          EXCLUDE: ".git/,backend/target/,frontend/node_modules/,.env"
          ARGS: "-rlgoDzvc --delete"
      - name: Configurer et redémarrer les services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cat > /opt/team-kanban/.env <<'EOF'
            DOMAIN=${{ secrets.DOMAIN }}
            APP_URL=https://${{ secrets.DOMAIN }}
            GITHUB_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}
            GITHUB_CLIENT_SECRET=${{ secrets.GH_CLIENT_SECRET }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            EOF
            cd /opt/team-kanban
            docker compose up -d --build
            docker image prune -f
